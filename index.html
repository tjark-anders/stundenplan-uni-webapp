<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stundenplan</title>

    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>
</head>

<body>

    <header>
        <h1>Projekt</h1>
        <button class="theme-toggle"><span class="toggle-circle"><img class="toggleImg" src="./assets/icons/sun.svg"></span></button>
    </header>

    <main>
        <div id="course-selection">

        </div>

        <!-- STUNDENPLAN -->
        <div id="course-schedule">
            <h2>Mein Stundenplan</h2>

            <table class="schedule-table">
                <tr>
                    <th>Zeit</th>
                    <th>Montag</th>
                    <th>Dienstag</th>
                    <th>Mittwoch</th>
                    <th>Donnerstag</th>
                    <th>Freitag</th>
                </tr>

                <tr>
                    <td>08:15 - 09:45</td>
                    <td data-tag="Montag" data-block="1"></td>
                    <td data-tag="Dienstag" data-block="1"></td>
                    <td data-tag="Mittwoch" data-block="1"></td>
                    <td data-tag="Donnerstag" data-block="1"></td>
                    <td data-tag="Freitag" data-block="1"></td>
                </tr>

                <tr>
                    <td>10:15 - 11:45</td>
                    <td data-tag="Montag" data-block="2"></td>
                    <td data-tag="Dienstag" data-block="2"></td>
                    <td data-tag="Mittwoch" data-block="2"></td>
                    <td data-tag="Donnerstag" data-block="2"></td>
                    <td data-tag="Freitag" data-block="2"></td>
                </tr>

                <tr class="lunch-break">
                    <td>11:45 - 12:30</td>
                    <td colspan="5"> Mittagspause</td>
                </tr>

                <tr>
                    <td>12:30 - 14:00</td>
                    <td data-tag="Montag" data-block="3"></td>
                    <td data-tag="Dienstag" data-block="3"></td>
                    <td data-tag="Mittwoch" data-block="3"></td>
                    <td data-tag="Donnerstag" data-block="3"></td>
                    <td data-tag="Freitag" data-block="3"></td>
                </tr>

                <tr>
                    <td>14:15 - 15:45</td>
                    <td data-tag="Montag" data-block="4"></td>
                    <td data-tag="Dienstag" data-block="4"></td>
                    <td data-tag="Mittwoch" data-block="4"></td>
                    <td data-tag="Donnerstag" data-block="4"></td>
                    <td data-tag="Freitag" data-block="4"></td>
                </tr>

                <tr>
                    <td>16:00 - 17:30</td>
                    <td data-tag="Montag" data-block="5"></td>
                    <td data-tag="Dienstag" data-block="5"></td>
                    <td data-tag="Mittwoch" data-block="5"></td>
                    <td data-tag="Donnerstag" data-block="5"></td>
                    <td data-tag="Freitag" data-block="5"></td>
                </tr>

                <tr>
                    <td>17:45 - 19:15</td>
                    <td data-tag="Montag" data-block="6"></td>
                    <td data-tag="Dienstag" data-block="6"></td>
                    <td data-tag="Mittwoch" data-block="6"></td>
                    <td data-tag="Donnerstag" data-block="6"></td>
                    <td data-tag="Freitag" data-block="6"></td>
                </tr>
            </table>

        </div>

    </main>

</body>

</html>
